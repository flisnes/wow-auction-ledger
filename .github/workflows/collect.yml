name: Collect auction scan

on:
  # Odd minute: scheduled runs at :00 are the most likely to be delayed or dropped.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch all auction houses
        id: collect
        run: node collector/collect.mjs --region "${{ vars.REGION || 'eu' }}" --out out
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}

      # Scans are about 7 MB each, about 2.5 GB for 29 days. They are release
      # assets because releases have no total size limit, while artifacts
      # count against a 500 MB storage quota on the free plan.
      - name: Upload scan to the scans release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view scans > /dev/null 2>&1; then
            gh release create scans --prerelease --latest=false --title "Auction scans" \
              --notes "Full auction house scans from the last 29 days, one per collection run. Format: collector/lib/scan.mjs. Source: Blizzard Entertainment."
          fi
          gh release upload scans "${{ steps.collect.outputs.file }}"

      - name: Delete scans older than 29 days
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-scans.sh
