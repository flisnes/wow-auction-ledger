name: Collect auction snapshot

on:
  # Odd minute: scheduled runs at :00 are the most likely to be delayed or dropped.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and reduce auction houses
        id: collect
        run: node collector/collect.mjs --region "${{ vars.REGION || 'eu' }}" --out out
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}

      # Snapshots are kept as short-lived artifacts rather than commits so the
      # repository only grows by one daily aggregate per day.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/*.json.gz
          retention-days: 4
          if-no-files-found: error
