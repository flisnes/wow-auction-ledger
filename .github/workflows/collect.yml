name: Collect auction scan

on:
  # Odd minute: scheduled runs at :00 are the most likely to be delayed or dropped.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

# Scans go to a private repository (repository variable DATA_REPO, default
# <owner>/auction-ledger-data), written with the DATA_REPO_TOKEN secret: a
# fine-grained token with Contents read/write on that repository only.
env:
  GH_REPO: ${{ vars.DATA_REPO || format('{0}/auction-ledger-data', github.repository_owner) }}
  GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Repository variable REGIONS, a JSON array, overrides the default.
        region: ${{ fromJSON(vars.REGIONS || '["eu","us","kr","tw"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch all auction houses
        id: collect
        run: node collector/collect.mjs --region "${{ matrix.region }}" --out out
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}

      # Scans are up to about 7 MB each, about 2.5 GB per large region for 29
      # days. They are release assets because releases have no total size
      # limit, while artifacts count against a 500 MB storage quota on the
      # free plan. One release per region keeps each under the 1000-asset limit.
      - name: Upload scan to the region's scans release
        env:
          TAG: scans-${{ matrix.region }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret DATA_REPO_TOKEN is not set"
            exit 1
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --title "Auction scans ${{ matrix.region }}" \
              --notes "Full auction house scans for region ${{ matrix.region }} from the last 29 days, one per collection run. Format: collector/lib/scan.mjs. Source: Blizzard Entertainment."
          fi
          gh release upload "$TAG" "${{ steps.collect.outputs.file }}"

  prune:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Delete scans older than 29 days
        run: bash .github/scripts/prune-scans.sh
