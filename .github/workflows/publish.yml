name: Publish daily data and addon release

on:
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Rebuild every daily aggregate that still has scans (after a change to the metrics)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGION: ${{ vars.REGION || 'eu' }}
  GH_REPO: ${{ github.repository }}
  BACKFILL: ${{ inputs.backfill }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Daily aggregates live on the orphan "data" branch so main stays code only.
      - name: Check out data branch
        run: |
          if git fetch --depth=1 origin data:data; then
            git worktree add data data
          else
            git worktree add --orphan -b data data
          fi

      # Scans of days that already have an aggregate are skipped, unless this
      # is a backfill. A skipped run is caught up by the next one.
      - name: Download scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scans
          if ! release_id=$(gh api "repos/${GH_REPO}/releases/tags/scans" --jq .id 2>/dev/null); then
            echo "No scans release yet"
            exit 0
          fi
          today=$(date -u +%Y%m%d)
          patterns=()
          while read -r name; do
            stamp=${name#scan-${REGION}-}
            day=${stamp:0:8}
            [ "$day" = "$today" ] && continue
            daily="data/daily/${REGION}/${day:0:4}-${day:4:2}-${day:6:2}.json.gz"
            [ "$BACKFILL" != true ] && [ -f "$daily" ] && continue
            patterns+=(--pattern "$name")
          done < <(gh api --paginate "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100" \
            --jq ".[].name | select(startswith(\"scan-${REGION}-\"))")
          if [ ${#patterns[@]} -gt 0 ]; then
            gh release download scans --dir scans "${patterns[@]}"
          fi
          echo "$(( ${#patterns[@]} / 2 )) scans downloaded"

      - name: Aggregate completed days and drop expired ones
        run: |
          force=()
          if [ "$BACKFILL" = true ]; then force=(--force); fi
          node collector/aggregate.mjs --region "$REGION" --scans scans --data data "${force[@]}"

      # The branch is replaced by one parentless commit, so days that left the
      # 30-day window do not remain in its history.
      - name: Replace data branch with the current window
        working-directory: data
        run: |
          git add -A
          if [ -z "$(git ls-files)" ]; then
            echo "No daily aggregates yet"
            exit 0
          fi
          tree=$(git write-tree)
          if git rev-parse -q --verify HEAD > /dev/null && [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "No changes"
            exit 0
          fi
          commit=$(git commit-tree "$tree" -m "Daily aggregates as of $(date -u +%F)")
          git push --force origin "${commit}:refs/heads/data"

      - name: Generate addon data
        id: lua
        run: node collector/build-lua.mjs --region "$REGION" --data data --out addon/AuctionLedger/Data.lua

      - name: Package addon
        if: steps.lua.outputs.built == 'true'
        run: |
          version=$(date -u +%F)
          sed -i "s/@version@/${version}/" addon/AuctionLedger/AuctionLedger.toc
          mkdir -p dist
          (cd addon && zip -q -r "../dist/AuctionLedger-${version}.zip" AuctionLedger)
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Publish release
        if: steps.lua.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-${VERSION}"
          zip="dist/AuctionLedger-${VERSION}.zip"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --latest \
              --title "Price data ${VERSION}" \
              --notes "Daily auction house medians and price statistics for the 29 days before ${VERSION}, region ${REGION}. Source: Blizzard Entertainment."
          fi

      - name: Delete scans older than 29 days
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-scans.sh

      # Only today's release is kept, so no published release holds data older
      # than 30 days. If nothing was built today, every older release is removed.
      - name: Remove older releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today="data-$(date -u +%F)"
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep '^data-' | grep -vx "$today" |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
