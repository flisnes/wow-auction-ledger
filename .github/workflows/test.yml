name: Test

on:
  push:
    branches: [main]
    paths: ['collector/**', 'package.json', '.github/workflows/test.yml']
  pull_request:
    paths: ['collector/**', 'package.json', '.github/workflows/test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
